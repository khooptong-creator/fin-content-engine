<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        perspective: 1400px;
      }
      /* Full-bleed child, never the root itself: the producer's frame
         compositing can drop a background set on the composition root, which
         renders black even though preview and snapshot look correct. */
      #stage-fill {
        position: absolute;
        inset: 0;
        background: #0B1220;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35.566"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage-fill" class="clip" data-start="0" data-duration="35.566" data-track-index="0"></div>
      <div
        id="el-f01-hook"
        class="scene"
        data-composition-id="f01-hook"
        data-composition-src="compositions/frames/f01-hook.html"
        data-start="0.0"
        data-duration="8.038"
        data-track-index="1"
      ></div>
      <audio
        id="el-f01-hook-voice"
        src="assets/voice/01.mp3"
        data-start="0.25"
