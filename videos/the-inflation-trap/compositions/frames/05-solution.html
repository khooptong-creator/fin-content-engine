        tl.fromTo(coin,
          { yPercent: -100, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.1, ease: "none" },
          startT

          { yPercent: 800, opacity: 0, duration: 1.2, ease: "power1.in" },
          startT + 0.1

        { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1, 0.6)" },
